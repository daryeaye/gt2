      padding: 0;

      background: url('https://daryeaye.github.io/geotopia/thatsit.png') no-repeat center center fixed;
      background-size: cover;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 0 40px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #tutorialOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #tutorialBox {
      position: relative;
      width: min(860px, 88vw);
      height: min(500px, 78vh);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #tutorialImage {
      max-width: 100%;
      max-height: 100%;
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    #tutorialNext {
      position: absolute;
      right: -18px;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 50%;
      min-height: 140px;
      border: none;
      border-radius: 18px;
      background: rgba(255,255,255,0.88);
      color: #111;
      font-size: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
      line-height: 1;
      font-family: "Love Ya Like A Sister", cursive;
    }

    #tutorialNext:hover {
      background: rgba(255,255,255,0.96);
    }

    #header {
      width: 960px;
      background: #eee;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 2000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      box-sizing: border-box;
    }

    #topAuthRow, #progressRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    #topAuthLeft {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #logoutBtn, #introBtn, #authRegisterBtn, #authLoginBtn, #openFileBtn, #prev-btn, #next-btn,
    #unlockBtn, #collapse-widget, #side-widget button:not(#collapse-widget) {
      font-family: "Love Ya Like A Sister", cursive;
    }

    #logoutBtn, #introBtn, #authRegisterBtn, #authLoginBtn {
      font-size: 22px;
      padding: 6px 12px;
      cursor: pointer;
      background-color: lightblue;
      border: none;
      line-height: 1;
      border-radius: 6px;
    }

    #authStatus {
      font-size: 15px;
      font-family: "Comic Sans MS", sans-serif;
      color: #222;
      min-width: 170px;
      text-align: right;
    }


    #authOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 15000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #authOverlayBox {
      width: min(430px, 88vw);
      background: #fffdf7;
      border: 3px solid #000;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      padding: 24px 20px 18px;
      text-align: center;
      box-sizing: border-box;
    }

    #authOverlayTitle {
      font-family: "Love Ya Like A Sister", cursive;
      font-size: 34px;
      line-height: 1.05;
      margin-bottom: 10px;
      color: #111;
    }

    #authOverlayText {
      font-family: "Comic Sans MS", sans-serif;
      font-size: 16px;
      line-height: 1.35;
      color: #222;
      margin-bottom: 14px;
    }

    #auth-username,
    #auth-password {
      width: 100%;
      font-size: 18px;
      padding: 10px 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
      border: 2px solid #000;
      border-radius: 8px;
      font-family: "Comic Sans MS", sans-serif;
      background: #fff;
    }

    #authOverlayButtons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    #authModalStatus {
      font-family: "Comic Sans MS", sans-serif;
      font-size: 14px;
      line-height: 1.3;
      min-height: 18px;
      margin-top: 12px;
      color: #222;
    }

    #progressBar {
      flex: 1;
      background: #ccc;
      height: 20px;
      margin: 0 10px 0 0;
      position: relative;
    }

    #progress {
      background: green;
      height: 100%;
      width: 0%;
    }

    #progressText {
      font-size: 16px;
      white-space: nowrap;
    }

    #saveStatus {
      font-size: 13px;
      color: #444;
      min-width: 120px;
      text-align: right;
    }

    #main-area {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    #main-wrapper {
      position: relative;
      width: 960px;
    }

    #container {
      position: relative;
      width: 960px;
      height: 540px;
      border: 1px solid #ccc;
      background: white;
      overflow: hidden;
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 540px;
      display: none;
      overflow: hidden;
    }

    .page.active {
      display: block;
    }

    .box {
      position: absolute;
      border: 1px solid red;
      background-color: rgba(255,0,0,0.3);
    }

    .transparent {
      background-color: transparent !important;
    }

    input.typeable {
      position: absolute;
      font-family: "Comic Sans MS", sans-serif;
      font-size: 22px;
      border: 1px solid black;
      background: rgba(173,216,230,0.5);
      box-sizing: border-box;
    }

    .draggable-box {
      position: absolute;
      font-family: 'Caveat', cursive;
      font-size: 40px;
      font-weight: bold;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid red;
      background-color: rgba(255,255,255,0.7);
      cursor: move;
      user-select: none;
      z-index: 20;
    }

    #nav-buttons {
      position: absolute;
      top: 50%;
      left: -150px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 3000;
    }

    button {

      background-color: lightblue;
      border: none;
      padding: 10px 20px;
      margin: 0;
      cursor: pointer;
    }

      height: 540px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      margin-top: 10px;
      overflow: hidden;
      background: #fff;

      top: 0;
      left: 0;
      width: 960px;
      height: 540px;
      background: url('https://daryeaye.github.io/geotopia/role.jpg') no-repeat center/cover;

      background: rgba(255,0,0,0);
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    #pdfViewer {
      position: absolute;
      inset: 0;
      display: none;
      overflow-y: auto;
      overflow-x: hidden;
      background: #fff;
      z-index: 5;
    }

      display: block;
      margin: 12px auto;
      background: white;
    }

      top: 10px;
      left: 10px;

      border-radius: 6px;
      z-index: 10;
      display: none;

      line-height: 1;

    #side-widget {

      right: 20px;

      height: 200px;

      padding: 10px;
      box-sizing: border-box;
      font-family: 'Caveat', cursive;
      z-index: 999;

    #side-widget.collapsed {

      height: 24px;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      font-family: "Comic Sans MS", sans-serif;
      font-size: 8px;
      line-height: 1;
      white-space: nowrap;
    }

    #side-widget.collapsed * {
      display: none !important;
    }

    #side-widget.collapsed::after {
      content: "Translation";
    }

      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      padding: 0;
      line-height: 1;
      font-size: 14px;
      background: lightblue;
      border: none;
      border-radius: 6px;
      cursor: pointer;

      font-size: 24px;
      text-align: center;
      margin: 0 0 10px;
    }

      display: block;
      margin: 0 auto;
      font-size: 20px;
      cursor: pointer;
      text-align: center;
      background: lightblue;
      border: none;
      padding: 10px;
    }

    #side-widget a {
      display: block;
      margin: 0 auto;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      background: lightblue;
      border: none;
      padding: 6px;
      text-decoration: none;
      color: inherit;
      font-family: "Comic Sans MS", sans-serif;
    }

    #selection-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      z-index: 1000;
    }

    #selection-box {
      position: absolute;
      border: 2px dashed red;
      background: rgba(0,0,0,0.1);
    }

    #pageTransitionOverlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 10050;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    #customPopupOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
    }

      background: #fffdf7;
      border: 3px solid #000;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      padding: 24px 20px 18px;
      text-align: center;
      font-family: "Comic Sans MS", sans-serif;
    }

    #customPopupMessage {

      line-height: 1.35;
      color: #111;
      margin-bottom: 18px;
    }

    #customPopupButtons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .popupBtn {
      font-family: "Love Ya Like A Sister", cursive;
      font-size: 24px;
      background: lightblue;
      border: 2px solid #000;
      border-radius: 10px;
      padding: 8px 20px;
      cursor: pointer;
    }
  </style>
</head>

  <script>
    const TUTORIAL_IMAGES = [
      "https://daryeaye.github.io/geotopia/t2.jpg",
      "https://daryeaye.github.io/geotopia/t3.jpg"
    ];

    const TUTORIAL_STORAGE_KEY = "lt2_tutorial_seen";
    const APP_ID = "losttreasure-pt2";
    const WORKER_BASE_URL = "https://geotopia-powerfall-auth-api.daryeaye.workers.dev";
    const SESSION_STORAGE = {
      token: "lt2_auth_token",
      username: "lt2_auth_username"
    };

    const INTRO_URL = "https://www.youtube.com/watch?v=lr_bH9Ory8E";
    const WRONG_MESSAGE = "❌ Nah. Mrs. James needs you to be more careful!";
    const SUCCESS_HINT = "✅Great job! Ask the merchant for the rest of the code.";
    const FINAL_UNLOCK_URL = "https://daryeaye.github.io/gt2/bosh.html";
    const ROLE_PDF_URLS = {
      officer: "https://daryeaye.github.io/geotopia/GT1%20Officer+.pdf",
      professor: "https://daryeaye.github.io/geotopia/GT1%20Professor+.pdf",
      hacker: "https://daryeaye.github.io/geotopia/GT1%20Hacker+.pdf"
    };
    const ROLE_VIDEO_URL = "https://www.youtube.com/watch?v=Fj98o3aFfk8";

    let currentPage = 1;
    const totalPages = 15;
    let maxPageVisited = 1;

    let currentPdfUrl = "";
    let currentPdfRole = "";
    let pdfScrollTop = 0;

    let authToken = "";
    let authUsername = "";
    let autoSaveTimer = null;
    let saveInFlight = false;
    let saveQueued = false;
    let isApplyingRemoteData = false;

    let dragDefaults = {};

    function openIntro() {
      window.open(INTRO_URL, "_blank");
    }

    function setAuthStatus(message, isError = false) {
      const el = document.getElementById("authStatus");
      el.textContent = message;
      el.style.color = isError ? "#b00020" : "#222";
    }

    function setSaveStatus(text) {
      document.getElementById("saveStatus").textContent = text;
    }


    function setAuthModalStatus(message, isError = false) {
      const status = document.getElementById("authModalStatus");
      if (!status) return;
      status.textContent = message || "";
      status.style.color = isError ? "#b00020" : "#222";
    }

    function openAuthOverlay(prefillUsername = "") {
      const overlay = document.getElementById("authOverlay");
      const usernameInput = document.getElementById("auth-username");
      const passwordInput = document.getElementById("auth-password");

      if (prefillUsername) {
        usernameInput.value = prefillUsername;
      } else if (authUsername) {
        usernameInput.value = authUsername;
      }

      passwordInput.value = "";
      setAuthModalStatus("Forgot your password? Please register a new account to start over.", false);
      overlay.style.display = "flex";
      usernameInput.focus();
    }

    function closeAuthOverlay() {
      const overlay = document.getElementById("authOverlay");
      overlay.style.display = "none";
      setAuthModalStatus("", false);
    }

    function maybeRequireAuthOverlay() {
      if (!authToken) {
        openAuthOverlay(authUsername || "");
      }
    }


    function closeCustomPopup() {
      document.getElementById("customPopupOverlay").style.display = "none";
      document.getElementById("customPopupMessage").textContent = "";
      document.getElementById("customPopupButtons").innerHTML = "";
    }

    function showCustomPopup(message, buttons = [{ text: "OK", action: closeCustomPopup }]) {
      const overlay = document.getElementById("customPopupOverlay");
      const msg = document.getElementById("customPopupMessage");
      const btnWrap = document.getElementById("customPopupButtons");

      msg.textContent = message;
      btnWrap.innerHTML = "";

      buttons.forEach(btn => {
        const b = document.createElement("button");
        b.className = "popupBtn";
        b.textContent = btn.text;
        b.onclick = () => {
          closeCustomPopup();
          if (btn.action) btn.action();
        };
        btnWrap.appendChild(b);
      });

      overlay.style.display = "flex";
    }

    function showMessagePopup(message) {
      showCustomPopup(message, [
        { text: "OK", action: closeCustomPopup }
      ]);
    }

    function updateAuthUI() {
      const signedIn = !!authToken;
      document.getElementById("logoutBtn").style.display = signedIn ? "inline-block" : "none";
      setAuthStatus(signedIn ? ("Logged in as " + (authUsername || "student")) : "Not logged in", false);
      if (signedIn) {
        closeAuthOverlay();
      }
    }

    function saveSessionLocally(token, username) {
      authToken = token || "";
      authUsername = username || "";
      localStorage.setItem(SESSION_STORAGE.token, authToken);
      localStorage.setItem(SESSION_STORAGE.username, authUsername);
      updateAuthUI();
    }

    function clearSessionLocally() {
      authToken = "";
      authUsername = "";
      localStorage.removeItem(SESSION_STORAGE.token);
      localStorage.removeItem(SESSION_STORAGE.username);
      updateAuthUI();
    }

    function restoreSessionLocally() {
      authToken = localStorage.getItem(SESSION_STORAGE.token) || "";
      authUsername = localStorage.getItem(SESSION_STORAGE.username) || "";
      updateAuthUI();
    }

    function getTypeableInputs() {
      return Array.from(document.querySelectorAll("input.typeable"));
    }

    function getInputSnapshot() {
      const snapshot = {};
      getTypeableInputs().forEach(el => {
        snapshot[el.id] = el.value || "";
      });
      return snapshot;
    }

    function applyInputSnapshot(snapshot) {
      isApplyingRemoteData = true;
      getTypeableInputs().forEach(el => {
        el.value = snapshot && Object.prototype.hasOwnProperty.call(snapshot, el.id)
          ? (snapshot[el.id] ?? "")
          : "";
      });
      isApplyingRemoteData = false;
    }

    function captureDragDefaults() {
      dragDefaults = {};
      document.querySelectorAll(".draggable-box").forEach(el => {
        const style = window.getComputedStyle(el);
        dragDefaults[el.id] = {
          left: parseFloat(style.left) || 0,
          top: parseFloat(style.top) || 0
        };
      });
    }

    function getDraggableSnapshot() {
      const snapshot = {};
      document.querySelectorAll(".draggable-box").forEach(el => {
        const style = window.getComputedStyle(el);
        snapshot[el.id] = {
          left: parseFloat(style.left) || 0,
          top: parseFloat(style.top) || 0
        };
      });
      return snapshot;
    }

    function applyDraggableSnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== "object") return;
      Object.entries(snapshot).forEach(([id, pos]) => {
        const el = document.getElementById(id);
        if (!el || !pos) return;
        if (typeof pos.left === "number") el.style.left = pos.left + "px";
        if (typeof pos.top === "number") el.style.top = pos.top + "px";
      });
    }

    function resetSecondCanvasToRoleStage() {
      const roleContainer = document.getElementById("role-container");
      const viewer = document.getElementById("pdfViewer");
      const status = document.getElementById("pdfStatus");
      roleContainer.classList.remove("pdf-mode");
      viewer.style.display = "none";
      viewer.innerHTML = "";
      viewer.scrollTop = 0;
      status.style.display = "none";
      currentPdfUrl = "";
      currentPdfRole = "";
      pdfScrollTop = 0;
    }

    function buildProgressPayload() {
      return {
        playerName: authUsername,
        currentPage,
        maxPageVisited,
        currentPdfUrl,
        currentPdfRole,
        pdfScrollTop,
        inputValues: getInputSnapshot(),
        draggablePositions: getDraggableSnapshot()
      };
    }

    async function applyProgressPayload(payload) {
      if (!payload || typeof payload !== "object") return;

      applyInputSnapshot(payload.inputValues || {});
      applyDraggableSnapshot(payload.draggablePositions || {});

      currentPage = Number(payload.currentPage);
      if (!Number.isInteger(currentPage) || currentPage < 1 || currentPage > totalPages) currentPage = 1;

      maxPageVisited = Number(payload.maxPageVisited);
      if (!Number.isInteger(maxPageVisited) || maxPageVisited < currentPage) maxPageVisited = currentPage;
      if (maxPageVisited > totalPages) maxPageVisited = totalPages;

      currentPdfUrl = payload.currentPdfUrl || "";
      currentPdfRole = payload.currentPdfRole || "";
      pdfScrollTop = Number(payload.pdfScrollTop) || 0;

      showPage(currentPage);

      if (currentPdfUrl) {
        await renderPdfIntoSecondCanvas(currentPdfUrl, currentPdfRole, true);
      } else {
        resetSecondCanvasToRoleStage();
      }
    }

    async function apiFetch(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      if (authToken) {
        headers.Authorization = "Bearer " + authToken;
      }

      const response = await fetch(WORKER_BASE_URL + path, {
        method: options.method || "GET",
        headers,
        body: options.body
      });

      const json = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(json.error || "Request failed");
      }
      return json;
    }

    async function registerUser() {
      const usernameInput = document.getElementById("auth-username");
      const passwordInput = document.getElementById("auth-password");

      const username = usernameInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!username || !password) {
        setAuthStatus("Enter username and password", true);
        setAuthModalStatus("Enter username and password.", true);
        return;
      }

      if (/\s/.test(username)) {
        setAuthStatus("Username cannot contain spaces.", true);
        setAuthModalStatus("Username cannot contain spaces.", true);
        return;
      }

      try {
        setAuthStatus("Registering...");
        setAuthModalStatus("Registering...", false);
        const result = await apiFetch("/api/register", {
          method: "POST",
          body: JSON.stringify({ username, password, appId: APP_ID })
        });

        saveSessionLocally(result.token, result.username || username);
        passwordInput.value = "";

        if (result.saveData && typeof result.saveData === "object" && Object.keys(result.saveData).length > 0) {
          await applyProgressPayload(result.saveData);
        } else {
          setSaveStatus("Loaded");
        }

        setAuthStatus("Account created.");
        setAuthModalStatus("Account created.", false);
        closeAuthOverlay();
      } catch (err) {
        setAuthStatus(err.message || "Register failed", true);
        setAuthModalStatus(err.message || "Register failed", true);
      }
    }

    async function loginUser() {
      const usernameInput = document.getElementById("auth-username");
      const passwordInput = document.getElementById("auth-password");

      const username = usernameInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!username || !password) {
        setAuthStatus("Enter username and password", true);
        setAuthModalStatus("Enter username and password.", true);
        return;
      }

      if (/\s/.test(username)) {
        setAuthStatus("Username cannot contain spaces.", true);
        setAuthModalStatus("Username cannot contain spaces.", true);
        return;
      }

      try {
        setAuthStatus("Logging in...");
        setAuthModalStatus("Logging in...", false);

        const result = await apiFetch("/api/login", {
          method: "POST",
          body: JSON.stringify({ username, password, appId: APP_ID })
        });

        saveSessionLocally(result.token, result.username || username);
        passwordInput.value = "";

        const loadResult = await apiFetch("/api/load?appId=" + encodeURIComponent(APP_ID), { method: "GET" });

        if (loadResult && loadResult.username) {
          authUsername = loadResult.username;
          localStorage.setItem(SESSION_STORAGE.username, authUsername);
          updateAuthUI();
        }

        await applyProgressPayload((loadResult && loadResult.saveData) || {});
        setSaveStatus("Loaded");
        setAuthModalStatus("Logged in.", false);
        closeAuthOverlay();
      } catch (err) {
        setAuthStatus(err.message || "Login failed", true);
        setAuthModalStatus(err.message || "Login failed", true);
      }
    }

    async function loadProgressFromServer() {
      if (!authToken) return;

      try {
        const result = await apiFetch("/api/load?appId=" + encodeURIComponent(APP_ID), { method: "GET" });
        if (result.saveData) {
          await applyProgressPayload(result.saveData);
        }
        if (result.username) {
          authUsername = result.username;
          localStorage.setItem(SESSION_STORAGE.username, authUsername);
        }
        setAuthStatus("Signed in as " + authUsername);
      } catch (err) {
        setAuthStatus(err.message || "Could not load progress", true);
      }
    }

    async function saveProgressToServer() {
      if (!authToken || saveInFlight) return;
      saveInFlight = true;

      try {
        setSaveStatus("Saving...");
        await apiFetch("/api/save", {
          method: "POST",
          body: JSON.stringify({
            appId: APP_ID,
            saveData: buildProgressPayload()
          })
        });
        setSaveStatus("Saved");
        setAuthStatus("Saved for " + authUsername);
      } catch (err) {
        setSaveStatus("Save failed");
        setAuthStatus(err.message || "Save failed", true);
      } finally {
        saveInFlight = false;
        if (saveQueued) {
          saveQueued = false;
          saveProgressToServer();
        }
      }
    }

    function queueCloudSave() {
      if (isApplyingRemoteData || !authToken) return;

      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        if (saveInFlight) {
          saveQueued = true;
          return;
        }
        saveProgressToServer();
      }, 900);
    }

    async function logoutUser() {
      clearTimeout(autoSaveTimer);

      try {
        if (authToken) {
          await apiFetch("/api/logout", {
            method: "POST",
            body: "{}"
          });
        }
      } catch (err) {
        console.error(err);
      }

      const prefill = authUsername || "";
      clearSessionLocally();
      setSaveStatus("Not saved yet");
      openAuthOverlay(prefill);
    }

    function updateProgress() {
      const pct = (maxPageVisited / totalPages) * 100;
      document.getElementById("progress").style.width = pct + "%";
      document.getElementById("progressText").innerText = pct.toFixed(0) + "% completed";
    }

    function showPage(p) {
      for (let i = 1; i <= totalPages; i++) {
        document.getElementById("page" + i).classList.remove("active");
      }
      document.getElementById("page" + p).classList.add("active");

      document.getElementById("prev-btn").style.display = p === 1 ? "none" : "inline-block";
      document.getElementById("next-btn").style.display = p === totalPages ? "none" : "inline-block";

      updateProgress();
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runCanvasTransition(action) {
      const overlay = document.getElementById("pageTransitionOverlay");
      overlay.style.pointerEvents = "auto";
      overlay.style.opacity = "1";
      await wait(280);
      action();
      await wait(60);
      overlay.style.opacity = "0";
      await wait(280);
      overlay.style.pointerEvents = "none";
    }

    function validateCurrentPage(pageNum) {
      if (pageNum === 5) {
        const t = document.getElementById("middleTopInput").value.trim().toLowerCase();
        const b = document.getElementById("middleBottomInput").value.trim().toLowerCase();
        return t === "45" && b === "45";
      }

      if (pageNum === 6) {
        const v = document.getElementById("page6MiddleInput").value.trim().toLowerCase();
        return v === "30";
      }

      if (pageNum === 9 || pageNum === 10) {
        const ids = pageNum === 9
          ? ["p9box3","p9box4","p9box5","p9box6","p9box7","p9box8","p9box9","p9box10","p9box11","p9box12","p9box13","p9box14","p9box15","p9box16","p9box17","p9box18"]
          : ["p10box3","p10box4","p10box5","p10box6","p10box7","p10box8","p10box9","p10box10","p10box11","p10box12","p10box13","p10box14","p10box15","p10box16","p10box17","p10box18"];
        return ids.every(id => document.getElementById(id).value.trim() !== "");
      }

      if (pageNum === 12) {
        return (
          document.getElementById("p12box1").value.trim().toLowerCase() === "yes" &&
          document.getElementById("p12box2").value.trim().toLowerCase() === "no" &&
          document.getElementById("p12box3").value.trim().toLowerCase() === "no" &&
          document.getElementById("p12box4").value.trim().toLowerCase() === "yes"
        );
      }

      if (pageNum === 13) {
        return (
          document.getElementById("p13box1").value.trim().toLowerCase() === "3" &&
          document.getElementById("p13box2").value.trim().toLowerCase() === "4" &&
          document.getElementById("p13box3").value.trim().toLowerCase() === "5" &&
          document.getElementById("p13box4").value.trim().toLowerCase() === "6" &&
          document.getElementById("p13box5").value.trim().toLowerCase() === "7"
        );
      }

      if (pageNum === 14) {
        return (
          document.getElementById("p14box1").value.trim().toLowerCase() === "1" &&
          document.getElementById("p14box9").value.trim().toLowerCase() === "9" &&
          document.getElementById("p14box10").value.trim().toLowerCase() === "third" &&
          document.getElementById("p14box11").value.trim().toLowerCase() === "sum" &&
          document.getElementById("p14box12").value.trim().toLowerCase() === "difference"
        );
      }

      return true;
    }

    async function nextPage() {
      if (!validateCurrentPage(currentPage)) {
        showMessagePopup(WRONG_MESSAGE);
        return;
      }

      if (currentPage < totalPages) {
        await runCanvasTransition(() => {
          currentPage++;
          if (currentPage > maxPageVisited) maxPageVisited = currentPage;
          showPage(currentPage);
        });
        queueCloudSave();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        showPage(currentPage);
        queueCloudSave();
      }
    }

    function makeDraggable(el) {
      el.onmousedown = function (e) {
        e.preventDefault();
        const ox = e.clientX - parseFloat(window.getComputedStyle(el).left);
        const oy = e.clientY - parseFloat(window.getComputedStyle(el).top);

        function moveH(e) {
          el.style.left = (e.clientX - ox) + "px";
          el.style.top = (e.clientY - oy) + "px";
        }

        function upH() {
          document.removeEventListener("mousemove", moveH);
          document.removeEventListener("mouseup", upH);
          queueCloudSave();
        }

        document.addEventListener("mousemove", moveH);
        document.addEventListener("mouseup", upH);
      };
    }

    function initTypeableInputs() {
      getTypeableInputs().forEach(el => {
        el.addEventListener("input", queueCloudSave);
      });
    }

    function initPdfJs() {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    async function renderPdfIntoSecondCanvas(pdfUrl, roleKey = "", preserveScroll = false) {
      const roleContainer = document.getElementById("role-container");
      const viewer = document.getElementById("pdfViewer");
      const status = document.getElementById("pdfStatus");

      currentPdfUrl = pdfUrl || "";
      currentPdfRole = roleKey || "";
      if (!preserveScroll) pdfScrollTop = 0;

      roleContainer.classList.add("pdf-mode");
      viewer.style.display = "block";
      viewer.innerHTML = "";
      viewer.scrollTop = 0;

      status.style.display = "block";
      status.textContent = "Loading PDF...";

      try {
        const loadingTask = pdfjsLib.getDocument({ url: pdfUrl });
        const pdf = await loadingTask.promise;

        status.textContent = "Rendering pages...";

        const targetWidth = 920;
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport1 = page.getViewport({ scale: 1 });
          const scale = targetWidth / viewport1.width;
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement("canvas");
          canvas.className = "pdfPageCanvas";
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          const ctx = canvas.getContext("2d", { alpha: false });
          viewer.appendChild(canvas);

          await page.render({ canvasContext: ctx, viewport }).promise;
        }

        status.style.display = "none";
        viewer.scrollTop = preserveScroll ? pdfScrollTop : 0;
        queueCloudSave();
      } catch (err) {
        console.error("PDF.js render error:", err);
        status.textContent = "Failed to load PDF (see Console).";
      }
    }

    function initSecondCanvasHotspots() {
      document.getElementById("hotspot-officer").addEventListener("click", function () {
        renderPdfIntoSecondCanvas(ROLE_PDF_URLS.officer, "officer");
      });

      document.getElementById("hotspot-professor").addEventListener("click", function () {
        renderPdfIntoSecondCanvas(ROLE_PDF_URLS.professor, "professor");
      });

      document.getElementById("hotspot-hacker").addEventListener("click", function () {
        renderPdfIntoSecondCanvas(ROLE_PDF_URLS.hacker, "hacker");
      });

      document.getElementById("hotspot-video").addEventListener("click", function () {
        window.open(ROLE_VIDEO_URL, "_blank");
      });

      document.getElementById("pdfViewer").addEventListener("scroll", function (e) {
        pdfScrollTop = e.target.scrollTop;
        queueCloudSave();
      });
    }

    function initOpenFileButton() {
      document.getElementById("openFileBtn").addEventListener("click", function () {
        if (!currentPdfUrl) {
          showMessagePopup("Pick a role file first.");
          return;
        }
        window.open(currentPdfUrl, "_blank");
      });
    }

    function initUnlockButton() {
      document.getElementById("unlockBtn").addEventListener("click", async function () {
        const yi = document.getElementById("p15yellow");
        const val = yi.value.trim().toLowerCase();

        if (val === "121") {
          showMessagePopup(SUCCESS_HINT);
        } else if (val === "121ja") {
          window.open(FINAL_UNLOCK_URL, "_blank");
          yi.value = "";
          queueCloudSave();
        } else {
          showMessagePopup(WRONG_MESSAGE);
        }
      });
    }

    function initTranslatorWidget() {
      const widget = document.getElementById("side-widget");
      const collapseBtn = document.getElementById("collapse-widget");

      collapseBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        widget.classList.add("collapsed");
      });

      widget.addEventListener("click", function () {
        if (widget.classList.contains("collapsed")) {
          widget.classList.remove("collapsed");
        }
      });
    }

    function initTranslationScreenshotTool() {
      document.getElementById("select-text").addEventListener("click", function () {
        const overlay = document.createElement("div");
        overlay.id = "selection-overlay";
        document.body.appendChild(overlay);

        let startX, startY, selectionBox;

        overlay.addEventListener("mousedown", function (e) {
          startX = e.clientX;
          startY = e.clientY;

          selectionBox = document.createElement("div");
          selectionBox.id = "selection-box";
          selectionBox.style.left = startX + "px";
          selectionBox.style.top = startY + "px";
          selectionBox.style.width = "0px";
          selectionBox.style.height = "0px";
          overlay.appendChild(selectionBox);

          function mouseMoveHandler(e) {
            const currentX = e.clientX;
            const currentY = e.clientY;
            const rectLeft = Math.min(startX, currentX);
            const rectTop = Math.min(startY, currentY);
            const rectWidth = Math.abs(currentX - startX);
            const rectHeight = Math.abs(currentY - startY);

            selectionBox.style.left = rectLeft + "px";
            selectionBox.style.top = rectTop + "px";
            selectionBox.style.width = rectWidth + "px";
            selectionBox.style.height = rectHeight + "px";
          }

          function mouseUpHandler() {
            overlay.removeEventListener("mousemove", mouseMoveHandler);
            overlay.removeEventListener("mouseup", mouseUpHandler);

            const boxRect = selectionBox.getBoundingClientRect();
            document.body.removeChild(overlay);

            const target = document.getElementById("container");
            const targetRect = target.getBoundingClientRect();

            html2canvas(target, { useCORS: true, allowTaint: false }).then(canvas => {
              const scaleFactor = canvas.width / targetRect.width;
              const sx = (boxRect.left - targetRect.left) * scaleFactor;
              const sy = (boxRect.top - targetRect.top) * scaleFactor;
              const sWidth = boxRect.width * scaleFactor;
              const sHeight = boxRect.height * scaleFactor;

              const croppedCanvas = document.createElement("canvas");
              croppedCanvas.width = sWidth;
              croppedCanvas.height = sHeight;

              const ctx = croppedCanvas.getContext("2d");
              ctx.drawImage(canvas, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);

              croppedCanvas.toBlob(blob => {
                if (blob) {
                  const item = new ClipboardItem({ "image/png": blob });
                  navigator.clipboard.write([item]).then(() => {
                    showMessagePopup("Screenshot copied to clipboard.");
                  }).catch(err => {
                    console.error("Failed to copy screenshot to clipboard", err);
                    showMessagePopup("Failed to copy screenshot to clipboard.");
                  });
                }
              });
            });
          }

          overlay.addEventListener("mousemove", mouseMoveHandler);
          overlay.addEventListener("mouseup", mouseUpHandler);
        });
      });
    }

    let tutorialIndex = 0;

    function showTutorial() {
      const alreadySeen = localStorage.getItem(TUTORIAL_STORAGE_KEY);
      if (alreadySeen === "yes") {
        maybeRequireAuthOverlay();
        return;
      }

      tutorialIndex = 0;
      document.getElementById("tutorialImage").src = TUTORIAL_IMAGES[tutorialIndex];
      document.getElementById("tutorialOverlay").style.display = "flex";
    }

    function nextTutorialSlide() {
      tutorialIndex++;
      if (tutorialIndex >= TUTORIAL_IMAGES.length) {
        document.getElementById("tutorialOverlay").style.display = "none";
        localStorage.setItem(TUTORIAL_STORAGE_KEY, "yes");
        maybeRequireAuthOverlay();
        return;
      }
      document.getElementById("tutorialImage").src = TUTORIAL_IMAGES[tutorialIndex];
    }

    function initTutorial() {
      document.getElementById("tutorialNext").addEventListener("click", nextTutorialSlide);
      TUTORIAL_IMAGES.forEach(url => {
        const pre = new Image();
        pre.src = url;
      });
      showTutorial();
    }

    document.addEventListener("DOMContentLoaded", async function () {
      initPdfJs();
      captureDragDefaults();
      document.querySelectorAll(".draggable").forEach(el => makeDraggable(el));
      initTypeableInputs();
      initSecondCanvasHotspots();
      initOpenFileButton();
      initUnlockButton();
      initTranslatorWidget();
      initTranslationScreenshotTool();

      document.getElementById("introBtn").addEventListener("click", openIntro);
      document.getElementById("authRegisterBtn").addEventListener("click", registerUser);
      document.getElementById("authLoginBtn").addEventListener("click", loginUser);
      document.getElementById("logoutBtn").addEventListener("click", logoutUser);
      document.getElementById("prev-btn").addEventListener("click", prevPage);
      document.getElementById("next-btn").addEventListener("click", nextPage);

      document.getElementById("auth-password").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          loginUser();
        }
      });

      restoreSessionLocally();
      showPage(currentPage);
      updateProgress();

      if (authToken) {
        try {
          await loadProgressFromServer();
        } catch (err) {
          console.error(err);
          clearSessionLocally();
          showPage(currentPage);
        }
      }

      initTutorial();
    });
  </script>
